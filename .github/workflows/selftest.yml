name: selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-eol-hygiene:
    name: Docs & LF Hygiene (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify doc_ref_check.py (exit 0)
        run: |
          python3 -I scripts/doc_ref_check.py \
            --allow scripts/doc_ref_allow.txt \
            --anchors scripts/doc_ref_anchors.txt \
            README.md 機能一覧と検証ガイド.txt ツールバーと機能ガイド.txt

      - name: Verify CRLF -> LF compliance per .gitattributes
        run: python3 -I scripts/check_eol.py

  windows-msvc-smoke:
    name: Windows MSVC Build & Selftest Smoke
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      QT_QPA_PLATFORM: offscreen
      VEDITOR_MCP_PORT: "18299"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg FFmpeg packages
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed\x64-windows
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-ffmpeg-core-x64-win-v1-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-ffmpeg-core-x64-win-v1-

      - name: Install FFmpeg (vcpkg)
        shell: cmd
        run: |
          if not exist "C:\vcpkg\installed\x64-windows\include\libavformat\avformat.h" (
            C:\vcpkg\vcpkg.exe install "ffmpeg[core,avcodec,avformat,avfilter,swscale,swresample]:x64-windows" --clean-after-build
          ) else (
            echo FFmpeg headers already cached in C:\vcpkg\installed\x64-windows
          )

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtmultimedia qtsvg qtimageformats"
          cache: true

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -S . -B build_win -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build Release
        shell: cmd
        run: |
          cmake --build build_win --config Release -- /m /v:m

      - name: Run Selftest Smoke Suite
        shell: pwsh
        run: |
          $env:PATH = "$env:Qt6_DIR\bin;C:\vcpkg\installed\x64-windows\bin;$env:PATH"
          $exe = "build_win\Release\v-simple-editor.exe"
          $suites = @("list", "tracker-preset", "hdr-routing", "radeon-amf", "puppet-arap", "context-menu-order")
          $fail = 0
          foreach ($s in $suites) {
            $log = Join-Path $env:TEMP ("ci_st_" + $s + ".log")
            Write-Host "=== SELFTEST: $s ==="
            & cmd.exe /c "$exe --selftest=$s > `"$log`" 2>&1"
            $rc = $LASTEXITCODE
            if (Test-Path $log) {
              if ($s -eq "list") {
                Get-Content $log | Select-Object -First 25
                Write-Host ("Total lines: " + (Get-Content $log).Count)
              } else {
                Get-Content $log | Select-String -Pattern "PASS|FAIL|SKIP|summary|gate-count"
                if ($rc -ne 0) {
                  Write-Host "--- TAIL ---"
                  Get-Content $log | Select-Object -Last 40
                }
              }
              Remove-Item $log -Force -ErrorAction SilentlyContinue
            }
            Write-Host "EXIT($s)=$rc"
            if ($rc -ne 0) { $fail = 1 }
          }

          Write-Host "=== GUARD: --selftest=unknown-foo (expect exit 2) ==="
          $log = Join-Path $env:TEMP "ci_st_unknown.log"
          & cmd.exe /c "$exe --selftest=unknown-foo > `"$log`" 2>&1"
          $rc = $LASTEXITCODE
          if (Test-Path $log) { Get-Content $log; Remove-Item $log -Force -ErrorAction SilentlyContinue }
          if ($rc -ne 2) {
            Write-Host "FAIL: expected exit 2 for unknown selftest, got $rc"
            $fail = 1
          } else {
            Write-Host "PASS: unknown selftest returned exit 2"
          }
          exit $fail
